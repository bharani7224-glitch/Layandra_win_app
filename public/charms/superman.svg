<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 160" width="190" height="160">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fff3bf" />
      <stop offset="40%" stopColor="#ffd43b" />
      <stop offset="80%" stopColor="#fab005" />
      <stop offset="100%" stopColor="#d9480f" />
    </linearGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fa5252" />
      <stop offset="50%" stopColor="#c92a2a" />
      <stop offset="100%" stopColor="#7a0010" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#000000" floodOpacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" floodColor="#ffd43b" floodOpacity="0.3" />
    </filter>
  </defs>
  <g filter="url(#shieldGlow)">
    <!-- Pentagonal Diamond Border -->
    <polygon points="95,12 182,38 152,108 95,152 38,108 8,38"
             fill="url(#shieldGold)"
             stroke="#ffffff"
             stroke-width="2" />
    <polygon points="95,18 174,42 146,104 95,144 44,104 16,42"
             fill="url(#shieldRed)"
             stroke="url(#shieldGold)"
             stroke-width="3" />
             
    <!-- Stylized Iconic "S" Emblem -->
    <path d="M 124,42 
             C 108,42 90,48 76,56 
             L 68,76 
             C 78,68 90,64 104,64 
             C 120,64 132,72 132,82 
             C 132,92 120,98 98,102 
             C 72,106 54,116 54,130 
             L 95,142 
             C 114,136 138,124 150,108 
             L 138,98 
             C 126,106 112,112 96,112 
             C 84,112 74,106 74,98 
             C 74,90 86,84 108,80 
             C 136,76 152,66 152,52 
             C 152,44 140,42 124,42 Z"
          fill="url(#shieldGold)"
          stroke="#fff3bf"
          stroke-width="1.5" />
    <circle cx="152" cy="46" r="6" fill="url(#shieldGold)" />
    <polygon points="44,56 58,56 46,74" fill="url(#shieldGold)" />
  </g>
</svg>

