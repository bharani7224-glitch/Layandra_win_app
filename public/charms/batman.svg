<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150">
  <defs>
    <linearGradient id="batmanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2c3038" />
      <stop offset="35%" stopColor="#1a1c22" />
      <stop offset="50%" stopColor="#3d4450" />
      <stop offset="65%" stopColor="#15171b" />
      <stop offset="100%" stopColor="#0d0e12" />
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffd700" />
      <stop offset="50%" stopColor="#c59b27" />
      <stop offset="100%" stopColor="#7a5d12" />
    </linearGradient>
    <filter id="batGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#000000" floodOpacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" floodColor="#ffd700" floodOpacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#batGlow)">
    <!-- Sleek Batarang Silhouette with Dual-tone Metallic Fill and Gold Bevel -->
    <path d="M 120,42 
             C 123,28 126,18 129,14 
             L 132,32 
             C 142,30 162,24 185,28 
             C 215,34 238,58 238,72 
             C 218,72 195,84 180,105 
             C 170,95 152,90 138,94 
             C 134,105 128,125 120,138 
             C 112,125 106,105 102,94 
             C 88,90 70,95 60,105 
             C 45,84 22,72 2,72 
             C 2,58 25,34 55,28 
             C 78,24 98,30 108,32 
             L 111,14 
             C 114,18 117,28 120,42 Z"
          fill="url(#batmanGrad)"
          stroke="url(#goldEdge)"
          stroke-width="3"
          stroke-linejoin="round"
          stroke-linecap="round" />
    <!-- Center Chest Ridge -->
    <path d="M 120,44 L 120,134" stroke="url(#goldEdge)" stroke-width="2" opacity="0.6" />
    <!-- Wing Accent Lines -->
    <path d="M 134,42 C 160,40 190,52 215,66" stroke="rgba(255,215,0,0.5)" stroke-width="2" fill="none" />
    <path d="M 106,42 C 80,40 50,52 25,66" stroke="rgba(255,215,0,0.5)" stroke-width="2" fill="none" />
  </g>
</svg>

