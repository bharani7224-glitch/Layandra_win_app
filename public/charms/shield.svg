<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="silverSheen" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="50%" stopColor="#dcdcdc" />
      <stop offset="100%" stopColor="#8e8e8e" />
    </radialGradient>
    <radialGradient id="shieldVibraniumRed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#ff4d4d" />
      <stop offset="50%" stopColor="#c92a2a" />
      <stop offset="100%" stopColor="#660008" />
    </radialGradient>
    <radialGradient id="shieldVibraniumBlue" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#339af0" />
      <stop offset="50%" stopColor="#1864ab" />
      <stop offset="100%" stopColor="#0b2b4d" />
    </radialGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#000000" floodOpacity="0.75" />
    </filter>
  </defs>
  <g filter="url(#capShadow)">
    <!-- Outer Red Ring -->
    <circle cx="90" cy="90" r="82" fill="url(#shieldVibraniumRed)" stroke="#ffffff" stroke-width="1.5" />
    <!-- White / Silver Ring -->
    <circle cx="90" cy="90" r="66" fill="url(#silverSheen)" />
    <!-- Inner Red Ring -->
    <circle cx="90" cy="90" r="50" fill="url(#shieldVibraniumRed)" />
    <!-- Blue Center Circle -->
    <circle cx="90" cy="90" r="34" fill="url(#shieldVibraniumBlue)" stroke="#ffffff" stroke-width="1" />
    <!-- Silver Star in Center -->
    <polygon points="90,62 94.7,76.5 109.9,76.5 97.6,85.5 102.3,100 90,91 77.7,100 82.4,85.5 70.1,76.5 85.3,76.5"
             fill="url(#silverSheen)"
             stroke="#ffffff"
             stroke-width="1" />
  </g>
</svg>

